<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#10151d);--panel:light-dark(#fff,#19212c);--panel2:light-dark(#f8fafc,#202a37);--text:light-dark(#182230,#edf2f7);--muted:light-dark(#667085,#a6b2c2);--line:light-dark(#e4e9f0,#303b4b);--brand:light-dark(#246bce,#73a9ff);--brandbg:light-dark(#eaf2ff,#203958);--green:light-dark(#14804a,#68d49b);--red:light-dark(#c43b46,#ff8c93);--shadow:0 8px 24px #1018280c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 16px;border-bottom:1px solid var(--line)}.brandmark{width:38px;height:38px;border-radius:12px;background:#246bce;color:white;display:grid;place-items:center;font-weight:900;font-size:18px}.brand strong{font-size:15px;display:block}.brand small{color:var(--muted);font-size:11px}.nav-label{padding:0 12px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-weight:600}.nav button:hover,.nav button.active{background:var(--brandbg);color:var(--brand)}.nav .ico{width:20px;text-align:center;font-size:17px}.side-note{margin-top:auto;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--muted);font-size:12px}.side-note b{color:var(--text);display:block;margin-bottom:4px}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px}.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--text)}.top-actions{display:flex;align-items:center;gap:10px}.today{color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--brandbg);color:var(--brand);display:grid;place-items:center;font-weight:800}.content{padding:28px 30px 40px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:23px}.eyebrow{color:var(--brand);font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;margin-bottom:6px}.pagehead h1{margin:0;font-size:26px;letter-spacing:-.6px}.pagehead p{margin:7px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.primary{background:#246bce;color:white;border-color:#246bce}.btn.small{padding:6px 9px;font-size:12px}.btn.danger{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--brandbg);color:var(--brand);display:grid;place-items:center;font-size:17px}.stat-value{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:13px 0 5px;overflow-wrap:anywhere}.stat-foot{font-size:11px;color:var(--muted)}.stat-foot .up{color:var(--green);font-weight:700}.grid-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:17px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:14px;margin:0}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.panel-body{padding:18px 19px}.chart{height:210px;display:flex;align-items:end;gap:13px;padding:10px 2px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 51px,var(--line) 52px)}.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;min-width:0}.bar{width:min(36px,75%);border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#5d9cf4,#246bce);min-height:4px;transition:height .3s}.bar-label{font-size:10px;color:var(--muted);padding-bottom:8px}.legend{display:flex;gap:18px;margin-top:13px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#246bce;margin-right:6px}.activity{display:grid;gap:0}.activity-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.activity-row:last-child{border-bottom:0}.activity-icon{width:32px;height:32px;flex:0 0 auto;border-radius:10px;background:var(--panel2);display:grid;place-items:center}.activity-row strong{display:block;font-size:12px}.activity-row small{color:var(--muted);font-size:11px}.activity-amount{margin-left:auto;text-align:right;font-weight:750;font-size:12px;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--red)}.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.quick{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--text)}.quick:hover{border-color:var(--brand);transform:translateY(-1px)}.quick span{display:block;font-size:19px;margin-bottom:8px}.quick b{font-size:12px;display:block}.quick small{font-size:11px;color:var(--muted)}.table-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.toolbar{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.searchwrap{display:flex;gap:8px;flex:1;min-width:180px}.field{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:9px 11px;border-radius:8px;outline:none;min-width:0}.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}.search{width:min(330px,100%)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;padding:12px 17px;background:var(--panel2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}td{padding:13px 17px;border-top:1px solid var(--line);font-size:12px}tbody tr:hover{background:var(--panel2)}.cell-title{font-weight:750}.subcell{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;background:var(--panel2);font-size:10px;font-weight:750;color:var(--muted)}.tag.good{background:light-dark(#e5f7ec,#173d2c);color:var(--green)}.tag.warn{background:light-dark(#fff4dc,#44351c);color:light-dark(#9b6500,#f1c56c)}.tag.bad{background:light-dark(#ffe8e8,#49242a);color:var(--red)}.row-actions{display:flex;gap:5px}.iconbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:5px 7px}.iconbtn:hover{color:var(--brand);border-color:var(--brand)}.tablefoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 17px;color:var(--muted);font-size:11px}.empty{text-align:center;color:var(--muted);padding:35px}.hidden{display:none!important}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-group{display:grid;gap:6px}.form-group.full{grid-column:1/-1}.form-group label{font-size:12px;font-weight:700;color:var(--muted)}.form-group input,.form-group select,.form-group textarea{width:100%}.modal-backdrop{position:fixed;inset:0;background:#0c1524a8;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px #0004}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:17px}.modal-content{padding:22px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.notice{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:12px;margin-bottom:18px}.notice b{color:var(--text)}.summary-strip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.mini-stat{padding:12px 15px;border:1px solid var(--line);background:var(--panel);border-radius:10px;min-width:140px}.mini-stat small{display:block;color:var(--muted);font-size:11px}.mini-stat b{display:block;margin-top:4px;font-size:16px}.toast{position:fixed;right:22px;bottom:22px;z-index:20;background:var(--text);color:var(--panel);padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);font-weight:700;max-width:90vw}.footer-note{color:var(--muted);font-size:11px;margin-top:18px}.mobile-menu{display:none}
@media(max-width:1050px){.layout{grid-template-columns:205px minmax(0,1fr)}.content{padding:22px 20px}.topbar{padding:0 20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-main{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{display:none;position:fixed;z-index:9;inset:0 auto 0 0;width:250px;box-shadow:0 0 0 100vw #0006}.sidebar.open{display:flex}.topbar{height:62px;padding:0 15px}.content{padding:20px 13px 30px}.pagehead{align-items:flex-start}.pagehead h1{font-size:22px}.pagehead p{max-width:260px}.today{display:none}.mobile-menu{display:inline-flex}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:21px}.stat-icon{width:29px;height:29px}.quick-grid{gap:8px}.quick{padding:12px}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.tablefoot{align-items:flex-start;flex-direction:column}.panel-body{padding:14px}.panel-head{padding:14px}.pagehead>.btn{padding:9px}.top-actions{gap:7px}}
</style></head>
<body><div class="app"><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">Q</div><div><strong>QUẢN LÝ PRO</strong><small>Business workspace</small></div></div><div class="nav-label">TỔNG QUAN</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span>Tổng quan</button><button data-page="products"><span class="ico">▤</span>Hàng hoá</button><button data-page="customers"><span class="ico">♙</span>Khách hàng</button><button data-page="suppliers"><span class="ico">♧</span>Nhà cung cấp</button><button data-page="inventory"><span class="ico">⇄</span>Xuất nhập tồn</button><button data-page="finance"><span class="ico">₫</span>Thu chi</button><button data-page="reports"><span class="ico">▥</span>Báo cáo</button></nav><div class="side-note"><b>✦ Không gian làm việc</b>Quản lý hàng hoá, đối tác, kho và dòng tiền tại một nơi.<br><span style="display:inline-block;margin-top:8px">● Dữ liệu lưu trên trình duyệt này</span></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuToggle">☰</button><div class="crumb">Không gian làm việc / <b id="crumb">Tổng quan</b></div></div><div class="top-actions"><span class="today" id="today"></span><div class="avatar">QL</div></div></header><section class="content" id="content"></section></main></div></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Number(n)||0)+' ₫';
const num=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0);
const todayISO=()=>new Date().toISOString().slice(0,10); const dateLabel=d=>d?new Date(d+'T00:00:00').toLocaleDateString('vi-VN'):'—';
const uid=()=>Math.random().toString(36).slice(2,9).toUpperCase();
const seed={products:[{id:'SP001',name:'Milk Base 1L',sku:'MB-001',unit:'Hộp',cost:70000,price:115000,stock:240,min:48,category:'Nguyên liệu sữa',note:''},{id:'SP002',name:'Bột Cheese Foam 1kg',sku:'CF-001',unit:'Túi',cost:152000,price:249000,stock:76,min:20,category:'Bột pha chế',note:''},{id:'SP003',name:'Matcha Milk Pudding',sku:'MP-001',unit:'Gói',cost:22800,price:37000,stock:18,min:30,category:'Bột pha chế',note:''},{id:'SP004',name:'Trà Oolong Nhài',sku:'TO-001',unit:'Kg',cost:95000,price:145000,stock:95,min:15,category:'Trà',note:''}],customers:[{id:'KH001',name:'Cà Phê Thứ Sáu',phone:'0901234567',email:'',address:'Hà Nội',debt:4500000,note:'Khách hàng chuỗi'},{id:'KH002',name:'Đại lý Tùng Lâm',phone:'0912345678',email:'',address:'Bắc Ninh',debt:0,note:'Đại lý'},{id:'KH003',name:'Trà sữa Mộc',phone:'0987654321',email:'',address:'Hải Phòng',debt:1750000,note:''}],suppliers:[{id:'NCC001',name:'Công ty Nguyên liệu Á Châu',phone:'02438889999',email:'sales@example.com',address:'Hà Nội',debt:6200000,note:''},{id:'NCC002',name:'Nhà cung cấp trà Việt',phone:'0909888777',email:'',address:'Thái Nguyên',debt:0,note:''}],transactions:[{id:'PT001',type:'in',date:todayISO(),category:'Bán hàng',party:'Cà Phê Thứ Sáu',amount:8500000,method:'Chuyển khoản',note:'Thu tiền đơn hàng'},{id:'PC001',type:'out',date:todayISO(),category:'Nhập hàng',party:'Công ty Nguyên liệu Á Châu',amount:3200000,method:'Chuyển khoản',note:'Thanh toán nhà cung cấp'},{id:'PT002',type:'in',date:todayISO(),category:'Thu khác',party:'Đại lý Tùng Lâm',amount:1500000,method:'Tiền mặt',note:'Thu công nợ'}],movements:[{id:'NK001',date:todayISO(),type:'in',productId:'SP001',qty:120,unitCost:70000,party:'Công ty Nguyên liệu Á Châu',note:'Nhập đầu kỳ'},{id:'XK001',date:todayISO(),type:'out',productId:'SP001',qty:12,unitCost:70000,party:'Cà Phê Thứ Sáu',note:'Xuất bán'},{id:'NK002',date:todayISO(),type:'in',productId:'SP004',qty:40,unitCost:95000,party:'Nhà cung cấp trà Việt',note:'Nhập hàng'}]};
let db;try{db=JSON.parse(localStorage.getItem('qlpro_data'))||structuredClone(seed)}catch(e){db=structuredClone(seed)};let page='dashboard',searchTerm='',filterType='all';
function save(){localStorage.setItem('qlpro_data',JSON.stringify(db))}function toast(s){$('#toastRoot').innerHTML=`<div class="toast">✓ ${s}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
const pageNames={dashboard:'Tổng quan',products:'Hàng hoá',customers:'Khách hàng',suppliers:'Nhà cung cấp',inventory:'Xuất nhập tồn',finance:'Thu chi',reports:'Báo cáo'};
function navigate(p){page=p;searchTerm='';filterType='all';$('#crumb').textContent=pageNames[p];$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');$('#today').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
function head(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">QUẢN LÝ KINH DOANH</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stat(label,value,icon,foot='Cập nhật theo dữ liệu hiện tại'){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function sum(a,fn){return a.reduce((s,x)=>s+(fn?fn(x):Number(x)||0),0)}
function dashboard(){let stockValue=sum(db.products,p=>p.stock*p.cost),low=db.products.filter(p=>p.stock<=p.min).length,ins=sum(db.transactions.filter(t=>t.type==='in'),t=>t.amount),outs=sum(db.transactions.filter(t=>t.type==='out'),t=>t.amount);let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=d.toISOString().slice(0,7),label=d.toLocaleDateString('vi-VN',{month:'short'});months.push({key,label,income:sum(db.transactions.filter(t=>t.type==='in'&&t.date.startsWith(key)),t=>t.amount),expense:sum(db.transactions.filter(t=>t.type==='out'&&t.date.startsWith(key)),t=>t.amount)})}let max=Math.max(1,...months.flatMap(m=>[m.income,m.expense]));let recent=[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return `${head('Tổng quan','Bức tranh hoạt động kinh doanh của bạn hôm nay.',`<button class="btn primary" onclick="openModal('transaction')">＋ Tạo phiếu thu chi</button>`)}<div class="stats">${stat('Tổng hàng hoá',num(db.products.length),'▤',`${num(sum(db.products,p=>p.stock))} đơn vị trong kho`)}${stat('Giá trị tồn kho',fmt(stockValue),'▦',`${low?`<span class="negative">${low} mặt hàng sắp hết</span>`:'<span class="up">Tồn kho ổn định</span>'}`)}${stat('Tổng thu',fmt(ins),'↗','Tổng các phiếu thu đã ghi')}${stat('Tổng chi',fmt(outs),'↘','Tổng các phiếu chi đã ghi')}</div><div class="grid-main"><div class="panel"><div class="panel-head"><div><h2>Dòng tiền thu & chi</h2><p>Thống kê 6 tháng gần nhất</p></div><span class="tag">VND</span></div><div class="panel-body"><div class="chart">${months.map(m=>`<div class="barcol" title="${m.label}: Thu ${fmt(m.income)} / Chi ${fmt(m.expense)}"><div style="display:flex;align-items:end;gap:3px;height:100%;width:100%;justify-content:center"><div class="bar" style="height:${m.income/max*85}%;background:linear-gradient(180deg,#5d9cf4,#246bce)"></div><div class="bar" style="height:${m.expense/max*85}%;background:linear-gradient(180deg,#f6bd65,#d98227)"></div></div><span class="bar-label">${m.label}</span></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Thu tiền</span><span><i class="dot" style="background:#d98227"></i>Chi tiền</span></div></div></div><div class="panel"><div class="panel-head"><div><h2>Hoạt động gần đây</h2><p>Các phiếu thu chi mới nhất</p></div><button class="btn small" onclick="navigate('finance')">Xem tất cả →</button></div><div class="panel-body"><div class="activity">${recent.length?recent.map(t=>`<div class="activity-row"><div class="activity-icon">${t.type==='in'?'↙':'↗'}</div><div><strong>${esc(t.category)}</strong><small>${esc(t.party||'Chưa xác định')} · ${dateLabel(t.date)}</small></div><div class="activity-amount ${t.type==='in'?'positive':'negative'}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</div></div>`).join(''):'<div class="empty">Chưa có giao dịch</div>'}</div></div></div></div><div class="quick-grid"><button class="quick" onclick="openModal('product')"><span>＋</span><b>Thêm hàng hoá</b><small>Tạo mã hàng mới</small></button><button class="quick" onclick="openModal('customer')"><span>♙</span><b>Thêm khách hàng</b><small>Lưu thông tin đối tác</small></button><button class="quick" onclick="openModal('movement')"><span>⇄</span><b>Nhập / xuất kho</b><small>Cập nhật tồn kho</small></button><button class="quick" onclick="openModal('transaction')"><span>₫</span><b>Ghi nhận thu chi</b><small>Theo dõi dòng tiền</small></button></div><div class="footer-note">Dữ liệu mẫu được thêm sẵn để bạn trải nghiệm. Hãy chỉnh sửa hoặc xoá để bắt đầu sử dụng dữ liệu thực tế.</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toolbar(placeholder,filters=''){return `<div class="toolbar"><div class="searchwrap"><input class="field search" id="tableSearch" placeholder="⌕  ${placeholder}" value="${esc(searchTerm)}" oninput="setSearch(this.value)">${filters}</div><button class="btn" onclick="exportCurrent()">⇩ Xuất CSV</button></div>`}
function products(){let arr=db.products.filter(p=>JSON.stringify(p).toLowerCase().includes(searchTerm.toLowerCase()));return `${head('Hàng hoá','Quản lý danh mục, giá bán, giá vốn và số lượng tồn.',`<button class="btn primary" onclick="openModal('product')">＋ Thêm hàng hoá</button>`)}<div class="summary-strip"><div class="mini-stat"><small>Tổng mặt hàng</small><b>${num(db.products.length)}</b></div><div class="mini-stat"><small>Tổng số lượng tồn</small><b>${num(sum(db.products,p=>p.stock))}</b></div><div class="mini-stat"><small>Giá trị tồn kho</small><b>${fmt(sum(db.products,p=>p.stock*p.cost))}</b></div><div class="mini-stat"><small>Cần nhập thêm</small><b class="${db.products.some(p=>p.stock<=p.min)?'negative':''}">${db.products.filter(p=>p.stock<=p.min).length}</b></div></div><div class="table-panel">${toolbar('Tìm theo tên, mã hàng, danh mục...')}<div class="tablewrap"><table><thead><tr><th>Mã / Tên hàng hoá</th><th>Danh mục</th><th>Giá vốn</th><th>Giá bán</th><th>Tồn kho</th><th>Giá trị tồn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${arr.length?arr.map(p=>`<tr><td><span class="cell-title">${esc(p.name)}</span><span class="subcell">${esc(p.sku)} · ${esc(p.unit)}</span></td><td>${esc(p.category||'Chưa phân loại')}</td><td>${fmt(p.cost)}</td><td><b>${fmt(p.price)}</b></td><td>${num(p.stock)} ${esc(p.unit)}</td><td>${fmt(p.stock*p.cost)}</td><td><span class="tag ${p.stock<=0?'bad':p.stock<=p.min?'warn':'good'}">${p.stock<=0?'Hết hàng':p.stock<=p.min?'Sắp hết':'Đang kinh doanh'}</span></td><td><div class="row-actions"><button class="iconbtn" onclick="openModal('product','${p.id}')">✎</button><button class="iconbtn" onclick="deleteRecord('products','${p.id}')">×</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Không tìm thấy hàng hoá</td></tr>'}</tbody></table></div><div class="tablefoot"><span>Hiển thị ${arr.length} / ${db.products.length} mặt hàng</span><span>Giá trị tồn tính theo giá vốn</span></div></div>`}
function partners(type){let isC=type==='customers',arr=db[type].filter(p=>JSON.stringify(p).toLowerCase().includes(searchTerm.toLowerCase())),title=isC?'Khách hàng':'Nhà cung cấp';return `${head(title,isC?'Quản lý thông tin khách mua hàng, liên hệ và công nợ.':'Quản lý đối tác cung ứng, thông tin liên hệ và công nợ.',`<button class="btn primary" onclick="openModal('${isC?'customer':'supplier'}')">＋ Thêm ${isC?'khách hàng':'nhà cung cấp'}</button>`)}<div class="summary-strip"><div class="mini-stat"><small>Tổng đối tác</small><b>${num(db[type].length)}</b></div><div class="mini-stat"><small>${isC?'Tổng phải thu':'Tổng phải trả'}</small><b>${fmt(sum(db[type],p=>p.debt))}</b></div><div class="mini-stat"><small>Có công nợ</small><b>${db[type].filter(p=>p.debt>0).length}</b></div></div><div class="table-panel">${toolbar('Tìm theo tên, số điện thoại, địa chỉ...')}<div class="tablewrap"><table><thead><tr><th>Mã / Tên đối tác</th><th>Điện thoại</th><th>Email</th><th>Địa chỉ</th><th>${isC?'Phải thu':'Phải trả'}</th><th>Ghi chú</th><th>Thao tác</th></tr></thead><tbody>${arr.length?arr.map(p=>`<tr><td><span class="cell-title">${esc(p.name)}</span><span class="subcell">${p.id}</span></td><td>${esc(p.phone||'—')}</td><td>${esc(p.email||'—')}</td><td>${esc(p.address||'—')}</td><td><b class="${p.debt>0?'negative':''}">${fmt(p.debt)}</b></td><td>${esc(p.note||'—')}</td><td><div class="row-actions"><button class="iconbtn" onclick="openModal('${isC?'customer':'supplier'}','${p.id}')">✎</button><button class="iconbtn" onclick="deleteRecord('${type}','${p.id}')">×</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Chưa có dữ liệu phù hợp</td></tr>'}</tbody></table></div><div class="tablefoot"><span>Hiển thị ${arr.length} / ${db[type].length} đối tác</span><span>Cập nhật thông tin bằng nút chỉnh sửa</span></div></div>`}
function inventory(){let arr=[...db.movements].filter(m=>JSON.stringify({...m,productName:db.products.find(p=>p.id===m.productId)?.name}).toLowerCase().includes(searchTerm.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));let ins=sum(db.movements.filter(m=>m.type==='in'),m=>m.qty),outs=sum(db.movements.filter(m=>m.type==='out'),m=>m.qty);return `${head('Xuất nhập tồn','Theo dõi mọi biến động kho và số lượng hàng còn lại.',`<button class="btn primary" onclick="openModal('movement')">＋ Tạo phiếu kho</button>`)}<div class="summary-strip"><div class="mini-stat"><small>Tổng nhập</small><b class="positive">${num(ins)} đơn vị</b></div><div class="mini-stat"><small>Tổng xuất</small><b class="negative">${num(outs)} đơn vị</b></div><div class="mini-stat"><small>Tồn hiện tại</small><b>${num(sum(db.products,p=>p.stock))} đơn vị</b></div><div class="mini-stat"><small>Giá trị tồn</small><b>${fmt(sum(db.products,p=>p.stock*p.cost))}</b></div></div><div class="table-panel">${toolbar('Tìm theo mã phiếu, tên hàng, đối tác...')}<div class="tablewrap"><table><thead><tr><th>Mã phiếu</th><th>Ngày</th><th>Loại phiếu</th><th>Hàng hoá</th><th>Số lượng</th><th>Đơn giá vốn</th><th>Đối tác</th><th>Ghi chú</th><th></th></tr></thead><tbody>${arr.length?arr.map(m=>{let p=db.products.find(p=>p.id===m.productId)||{};return `<tr><td><b>${m.id}</b></td><td>${dateLabel(m.date)}</td><td><span class="tag ${m.type==='in'?'good':'warn'}">${m.type==='in'?'Nhập kho':'Xuất kho'}</span></td><td><span class="cell-title">${esc(p.name||'Hàng đã xoá')}</span><span class="subcell">${esc(p.sku||'')}</span></td><td><b>${m.type==='in'?'+':'−'}${num(m.qty)} ${esc(p.unit||'đv')}</b></td><td>${fmt(m.unitCost)}</td><td>${esc(m.party||'—')}</td><td>${esc(m.note||'—')}</td><td><button class="iconbtn" onclick="deleteMovement('${m.id}')">×</button></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Chưa có phiếu xuất nhập kho</td></tr>'}</tbody></table></div><div class="tablefoot"><span>${arr.length} phiếu kho</span><span>Phiếu mới sẽ tự động cập nhật tồn kho</span></div></div>`}
function finance(){let arr=[...db.transactions].filter(t=>JSON.stringify(t).toLowerCase().includes(searchTerm.toLowerCase())&&(filterType==='all'||t.type===filterType)).sort((a,b)=>b.date.localeCompare(a.date));let ins=sum(db.transactions.filter(t=>t.type==='in'),t=>t.amount),outs=sum(db.transactions.filter(t=>t.type==='out'),t=>t.amount);return `${head('Thu chi','Ghi nhận dòng tiền, theo dõi phiếu thu, phiếu chi và số dư.',`<button class="btn primary" onclick="openModal('transaction')">＋ Tạo phiếu thu chi</button>`)}<div class="summary-strip"><div class="mini-stat"><small>Tổng thu</small><b class="positive">${fmt(ins)}</b></div><div class="mini-stat"><small>Tổng chi</small><b class="negative">${fmt(outs)}</b></div><div class="mini-stat"><small>Chênh lệch thu chi</small><b class="${ins-outs>=0?'positive':'negative'}">${fmt(ins-outs)}</b></div><div class="mini-stat"><small>Số phiếu</small><b>${db.transactions.length}</b></div></div><div class="table-panel">${toolbar('Tìm theo mã phiếu, nội dung, đối tác...',`<select class="field" style="max-width:155px" onchange="setFilter(this.value)"><option value="all" ${filterType==='all'?'selected':''}>Tất cả phiếu</option><option value="in" ${filterType==='in'?'selected':''}>Phiếu thu</option><option value="out" ${filterType==='out'?'selected':''}>Phiếu chi</option></select>`)}<div class="tablewrap"><table><thead><tr><th>Mã phiếu</th><th>Ngày</th><th>Loại</th><th>Danh mục / Nội dung</th><th>Đối tác</th><th>Thanh toán</th><th>Số tiền</th><th>Thao tác</th></tr></thead><tbody>${arr.length?arr.map(t=>`<tr><td><b>${t.id}</b></td><td>${dateLabel(t.date)}</td><td><span class="tag ${t.type==='in'?'good':'warn'}">${t.type==='in'?'Phiếu thu':'Phiếu chi'}</span></td><td><span class="cell-title">${esc(t.category)}</span><span class="subcell">${esc(t.note||'')}</span></td><td>${esc(t.party||'—')}</td><td>${esc(t.method||'—')}</td><td><b class="${t.type==='in'?'positive':'negative'}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</b></td><td><button class="iconbtn" onclick="deleteRecord('transactions','${t.id}')">×</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Chưa có phiếu thu chi phù hợp</td></tr>'}</tbody></table></div><div class="tablefoot"><span>Hiển thị ${arr.length} phiếu</span><span>Thu − Chi = ${fmt(ins-outs)}</span></div></div>`}
function reports(){let ins=sum(db.transactions.filter(t=>t.type==='in'),t=>t.amount),outs=sum(db.transactions.filter(t=>t.type==='out'),t=>t.amount),stock=sum(db.products,p=>p.stock*p.cost),low=db.products.filter(p=>p.stock<=p.min);return `${head('Báo cáo','Tổng hợp nhanh về kho, đối tác và tình hình thu chi.',`<button class="btn" onclick="exportCurrent()">⇩ Xuất báo cáo CSV</button>`)}<div class="stats">${stat('Tổng giá trị tồn kho',fmt(stock),'▦','Theo giá vốn')}${stat('Công nợ khách hàng',fmt(sum(db.customers,p=>p.debt)),'♙','Tổng phải thu')}${stat('Công nợ nhà cung cấp',fmt(sum(db.suppliers,p=>p.debt)),'♧','Tổng phải trả')}${stat('Thu chi ròng',fmt(ins-outs),'₫','Tổng thu trừ tổng chi')}</div><div class="grid-main"><div class="panel"><div class="panel-head"><div><h2>Chi tiết tồn kho</h2><p>Ưu tiên kiểm tra mặt hàng dưới định mức</p></div></div><div class="tablewrap"><table><thead><tr><th>Mặt hàng</th><th>Tồn kho</th><th>Định mức</th><th>Giá trị tồn</th><th>Trạng thái</th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b><span class="subcell">${p.sku}</span></td><td>${num(p.stock)} ${esc(p.unit)}</td><td>${num(p.min)}</td><td>${fmt(p.stock*p.cost)}</td><td><span class="tag ${p.stock<=p.min?'warn':'good'}">${p.stock<=p.min?'Cần nhập':'Đủ hàng'}</span></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><h2>Cảnh báo tồn kho</h2><p>${low.length} mặt hàng cần lưu ý</p></div></div><div class="panel-body"><div class="activity">${low.length?low.map(p=>`<div class="activity-row"><div class="activity-icon">⚠</div><div><strong>${esc(p.name)}</strong><small>Tồn ${num(p.stock)} ${esc(p.unit)} · Định mức ${num(p.min)}</small></div><button class="btn small" onclick="openModal('movement',null,'${p.id}')">Nhập</button></div>`).join(''):'<div class="empty">Tất cả mặt hàng đang trên định mức.</div>'}</div><div class="notice" style="margin-top:15px;margin-bottom:0">Báo cáo phản ánh dữ liệu đang lưu trong ứng dụng. Nên đối chiếu với chứng từ kế toán trước khi chốt sổ.</div></div></div></div>`}
function render(){const map={dashboard,products,customers:()=>partners('customers'),suppliers:()=>partners('suppliers'),inventory,finance,reports};$('#content').innerHTML=map[page]();}
window.setSearch=v=>{searchTerm=v;let pos=v.length;render();let el=$('#tableSearch');if(el){el.focus();el.setSelectionRange(pos,pos)}};window.setFilter=v=>{filterType=v;render()};
function field(label,name,value='',type='text',opts=null,required=false){let input=opts?`<select class="field" name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input class="field" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}>`;return `<div class="form-group"><label>${label}${required?' *':''}</label>${input}</div>`}
function openModal(kind,id=null,preProduct=null){let edit=null,collection='',title='';if(kind==='product'){collection='products';title=id?'Chỉnh sửa hàng hoá':'Thêm hàng hoá';edit=db.products.find(x=>x.id===id)||{name:'',sku:'',unit:'Hộp',cost:0,price:0,stock:0,min:0,category:'',note:''}}if(kind==='customer'||kind==='supplier'){collection=kind==='customer'?'customers':'suppliers';title=id?'Chỉnh sửa đối tác':kind==='customer'?'Thêm khách hàng':'Thêm nhà cung cấp';edit=db[collection].find(x=>x.id===id)||{name:'',phone:'',email:'',address:'',debt:0,note:''}}if(kind==='transaction'){collection='transactions';title='Tạo phiếu thu chi';edit={type:'in',date:todayISO(),category:'Bán hàng',party:'',amount:'',method:'Chuyển khoản',note:''}}if(kind==='movement'){collection='movements';title='Tạo phiếu nhập / xuất kho';edit={type:'in',date:todayISO(),productId:preProduct||db.products[0]?.id||'',qty:1,unitCost:db.products.find(p=>p.id===(preProduct||db.products[0]?.id))?.cost||0,party:'',note:''};if(!db.products.length){toast('Vui lòng thêm hàng hoá trước');return}}let form='';if(kind==='product')form=`<div class="form-grid">${field('Tên hàng hoá','name',edit.name,'text',null,true)}${field('Mã hàng / SKU','sku',edit.sku,'text',null,true)}${field('Danh mục','category',edit.category)}${field('Đơn vị tính','unit',edit.unit,'text',[['Hộp','Hộp'],['Thùng','Thùng'],['Túi','Túi'],['Kg','Kg'],['Gói','Gói'],['Chai','Chai'],['Cái','Cái'],['Lít','Lít']])}${field('Giá vốn (₫)','cost',edit.cost,'number',null,true)}${field('Giá bán (₫)','price',edit.price,'number',null,true)}${field('Số lượng tồn','stock',edit.stock,'number',null,true)}${field('Định mức tồn tối thiểu','min',edit.min,'number',null,true)}<div class="form-group full"><label>Ghi chú</label><input class="field" name="note" value="${esc(edit.note)}"></div></div>`;if(kind==='customer'||kind==='supplier')form=`<div class="form-grid">${field('Tên đối tác','name',edit.name,'text',null,true)}${field('Số điện thoại','phone',edit.phone)}${field('Email','email',edit.email,'email')}${field('Địa chỉ','address',edit.address)}${field('Công nợ hiện tại (₫)','debt',edit.debt,'number')}<div class="form-group"><label>Ghi chú</label><input class="field" name="note" value="${esc(edit.note)}"></div></div>`;if(kind==='transaction')form=`<div class="form-grid">${field('Loại phiếu','type',edit.type,'text',[['in','Phiếu thu'],['out','Phiếu chi']],true)}${field('Ngày chứng từ','date',edit.date,'date',null,true)}${field('Danh mục','category',edit.category,'text',[['Bán hàng','Bán hàng'],['Nhập hàng','Nhập hàng'],['Vận chuyển','Vận chuyển'],['Lương nhân viên','Lương nhân viên'],['Marketing','Marketing'],['Thu khác','Thu khác'],['Chi khác','Chi khác']],true)}${field('Số tiền (₫)','amount',edit.amount,'number',null,true)}${field('Đối tác / Người nộp nhận','party',edit.party)}${field('Phương thức','method',edit.method,'text',[['Tiền mặt','Tiền mặt'],['Chuyển khoản','Chuyển khoản'],['Ví điện tử','Ví điện tử']])}<div class="form-group full"><label>Nội dung / Ghi chú</label><input class="field" name="note" value="${esc(edit.note)}"></div></div>`;if(kind==='movement')form=`<div class="form-grid">${field('Loại phiếu','type',edit.type,'text',[['in','Nhập kho'],['out','Xuất kho']],true)}${field('Ngày chứng từ','date',edit.date,'date',null,true)}${field('Hàng hoá','productId',edit.productId,'text',db.products.map(p=>[p.id,`${p.name} (${p.sku})`]),true)}${field('Số lượng','qty',edit.qty,'number',null,true)}${field('Đơn giá vốn (₫)','unitCost',edit.unitCost,'number',null,true)}${field('Nhà cung cấp / Khách hàng','party',edit.party)}<div class="form-group full"><label>Lý do / Ghi chú</label><input class="field" name="note" value="${esc(edit.note)}"></div></div><div class="notice" style="margin-top:15px;margin-bottom:0">Lưu phiếu sẽ tự động cộng hoặc trừ số lượng tồn kho. Phiếu xuất không thể vượt tồn hiện tại.</div>`;$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><form id="recordForm"><div class="modal-content">${form}<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Huỷ</button><button class="btn primary" type="submit">${id?'Lưu thay đổi':'Lưu thông tin'}</button></div></div></form></div></div>`;$('#recordForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),o={};for(let [k,v] of fd.entries())o[k]=v;if(kind==='product'){o.cost=+o.cost;o.price=+o.price;o.stock=+o.stock;o.min=+o.min;if(!o.name.trim()||!o.sku.trim())return toast('Vui lòng nhập tên và mã hàng');if(!id&&db.products.some(p=>p.sku.toLowerCase()===o.sku.toLowerCase()))return toast('Mã hàng đã tồn tại');if(id){let old=db.products.find(p=>p.id===id);Object.assign(old,o)}else db.products.push({id:'SP'+uid(),...o})}else if(kind==='customer'||kind==='supplier'){o.debt=+o.debt||0;if(!o.name.trim())return toast('Vui lòng nhập tên đối tác');if(id)Object.assign(db[collection].find(p=>p.id===id),o);else db[collection].push({id:(kind==='customer'?'KH':'NCC')+uid(),...o})}else if(kind==='transaction'){o.amount=+o.amount;if(o.amount<=0)return toast('Số tiền phải lớn hơn 0');o.id=(o.type==='in'?'PT':'PC')+uid();db.transactions.push(o)}else if(kind==='movement'){o.qty=+o.qty;o.unitCost=+o.unitCost;let p=db.products.find(p=>p.id===o.productId);if(!p)return toast('Không tìm thấy hàng hoá');if(o.qty<=0)return toast('Số lượng phải lớn hơn 0');if(o.type==='out'&&p.stock<o.qty)return toast(`Tồn kho chỉ còn ${p.stock} ${p.unit}`);p.stock+=o.type==='in'?o.qty:-o.qty;o.id=(o.type==='in'?'NK':'XK')+uid();db.movements.push(o)}save();closeModal();render();toast('Đã lưu dữ liệu thành công')};}
window.openModal=openModal;window.closeModal=()=>$('#modalRoot').innerHTML='';window.deleteRecord=(collection,id)=>{if(!confirm('Bạn có chắc muốn xoá bản ghi này?'))return;db[collection]=db[collection].filter(x=>x.id!==id);save();render();toast('Đã xoá bản ghi')};window.deleteMovement=id=>{if(!confirm('Xoá phiếu kho sẽ hoàn tác số lượng tồn. Tiếp tục?'))return;let m=db.movements.find(x=>x.id===id);if(m){let p=db.products.find(p=>p.id===m.productId);if(p)p.stock+=m.type==='in'?-m.qty:m.qty}db.movements=db.movements.filter(x=>x.id!==id);save();render();toast('Đã xoá phiếu và cập nhật tồn kho')};
window.exportCurrent=()=>{let coll=page==='products'?'products':page==='customers'?'customers':page==='suppliers'?'suppliers':page==='inventory'?'movements':page==='finance'?'transactions':page==='reports'?'products':null;if(!coll){toast('Chọn một danh mục để xuất dữ liệu');return}let rows=db[coll];if(!rows.length){toast('Không có dữ liệu để xuất');return}let keys=[...new Set(rows.flatMap(o=>Object.keys(o)))],csv='\ufeff'+[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=coll+'-'+todayISO()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Đã xuất file CSV')};
render();
})();
</script><script>
(()=>{'use strict';
const nav=document.getElementById('nav'),content=document.getElementById('content');if(!nav||!content)return;
const retailBtn=document.createElement('button');retailBtn.dataset.page='retail';retailBtn.innerHTML='<span class="ico">🛍</span>Bán lẻ / POS';const productBtn=nav.querySelector('[data-page="products"]');if(productBtn)productBtn.after(retailBtn);else nav.append(retailBtn);
const money=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Number(n)||0)+' ₫';const escR=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cart=[],term='',customer='',discount=0,payment='Tiền mặt';
function load(){try{return JSON.parse(localStorage.getItem('qlpro_data'))||{products:[],transactions:[],movements:[]}}catch(e){return {products:[],transactions:[],movements:[]}}}function persist(d){localStorage.setItem('qlpro_data',JSON.stringify(d))}function toastR(s){const root=document.getElementById('toastRoot');root.innerHTML='<div class="toast">✓ '+escR(s)+'</div>';setTimeout(()=>root.innerHTML='',2500)}
function activate(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b===retailBtn));document.getElementById('crumb').textContent='Bán lẻ / POS';document.getElementById('sidebar').classList.remove('open');render()}
retailBtn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();activate()},true);
function add(id){const d=load(),p=d.products.find(x=>x.id===id);if(!p)return;if(p.stock<=0){toastR('Mặt hàng đã hết tồn kho');return}let line=cart.find(x=>x.id===id);if(line){if(line.qty>=p.stock){toastR('Số lượng vượt tồn kho');return}line.qty++}else cart.push({id:p.id,qty:1});render()}
function total(){return cart.reduce((s,l)=>{const p=load().products.find(x=>x.id===l.id);return s+(p?Number(p.price)*l.qty:0)},0)}
function render(){const d=load(),products=(d.products||[]).filter(p=>(p.name+' '+p.sku+' '+(p.category||'')).toLowerCase().includes(term.toLowerCase()));const subtotal=cart.reduce((s,l)=>{const p=d.products.find(x=>x.id===l.id);return s+(p?Number(p.price)*l.qty:0)},0),off=Math.min(subtotal,Math.max(0,Number(discount)||0)),grand=subtotal-off;
content.innerHTML='<div class="pagehead"><div><div class="eyebrow">BÁN HÀNG TẠI QUẦY</div><h1>Bán lẻ / POS</h1><p>Tạo đơn nhanh, áp dụng giá bán lẻ và tự động trừ tồn kho khi thanh toán.</p></div><button class="btn" id="retailHistory">Xem lịch sử bán</button></div><div class="grid-main" style="grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);align-items:start"><div><div class="panel"><div class="panel-head"><div><h2>Chọn hàng hoá</h2><p>'+products.length+' mặt hàng phù hợp</p></div></div><div class="panel-body"><input class="field" id="retailSearch" style="width:100%;margin-bottom:14px" placeholder="Tìm tên hoặc mã hàng..." value="'+escR(term)+'"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px">'+(products.length?products.map(p=>'<button class="quick" data-add="'+escR(p.id)+'" style="text-align:left"><b>'+escR(p.name)+'</b><small style="margin:5px 0">Mã: '+escR(p.sku)+' · Tồn: '+p.stock+' '+escR(p.unit)+'</small><strong style="color:var(--brand)">'+money(p.price)+'</strong><small>'+ (p.stock>0?'Bấm để thêm vào đơn':'Hết hàng')+'</small></button>').join(''):'<div class="empty">Chưa có hàng hoá. Hãy thêm ở mục Hàng hoá trước.</div>')+'</div></div></div><div class="notice" style="margin-top:14px"><b>Lưu ý:</b> Giá hiển thị lấy từ trường Giá bán của từng mặt hàng. Kiểm tra giá và tồn kho trước khi xác nhận đơn.</div></div><div class="panel"><div class="panel-head"><div><h2>Đơn bán lẻ hiện tại</h2><p>'+cart.reduce((s,l)=>s+l.qty,0)+' sản phẩm</p></div><button class="btn small" id="clearCart">Xoá đơn</button></div><div class="panel-body"><div class="activity">'+(cart.length?cart.map(l=>{const p=d.products.find(x=>x.id===l.id);return p?'<div class="activity-row"><div style="min-width:0;flex:1"><strong>'+escR(p.name)+'</strong><small>'+money(p.price)+' / '+escR(p.unit)+'</small><div style="display:flex;align-items:center;gap:7px;margin-top:7px"><button class="btn small" data-dec="'+p.id+'">−</button><b>'+l.qty+'</b><button class="btn small" data-inc="'+p.id+'">＋</button><button class="btn small danger" data-remove="'+p.id+'">Bỏ</button></div></div><div class="activity-amount">'+money(p.price*l.qty)+'</div></div>':''}).join(''):'<div class="empty">Chưa có sản phẩm trong đơn. Chọn hàng ở bên trái.</div>')+'</div><div style="display:grid;gap:12px;margin-top:16px"><label style="font-size:12px;font-weight:700;color:var(--muted)">Tên khách hàng (không bắt buộc)<input class="field" id="retailCustomer" style="width:100%;margin-top:6px" placeholder="Khách lẻ" value="'+escR(customer)+'"></label><label style="font-size:12px;font-weight:700;color:var(--muted)">Phương thức thanh toán<select class="field" id="retailPayment" style="width:100%;margin-top:6px"><option '+(payment==='Tiền mặt'?'selected':'')+'>Tiền mặt</option><option '+(payment==='Chuyển khoản'?'selected':'')+'>Chuyển khoản</option><option '+(payment==='Ví điện tử'?'selected':'')+'>Ví điện tử</option></select></label><label style="font-size:12px;font-weight:700;color:var(--muted)">Giảm giá (₫)<input class="field" id="retailDiscount" type="number" min="0" value="'+Number(discount||0)+'" style="width:100%;margin-top:6px"></label><div style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px"><div style="display:flex;justify-content:space-between"><span>Tiền hàng</span><b>'+money(subtotal)+'</b></div><div style="display:flex;justify-content:space-between"><span>Giảm giá</span><b>−'+money(off)+'</b></div><div style="display:flex;justify-content:space-between;font-size:18px"><strong>Khách cần trả</strong><strong style="color:var(--brand)">'+money(grand)+'</strong></div></div><button class="btn primary" id="checkout" style="width:100%;padding:12px" '+(!cart.length?'disabled':'')+'>✓ Xác nhận thanh toán</button></div></div></div><div id="retailHistoryPanel" style="margin-top:18px"></div>';
document.getElementById('retailSearch').oninput=e=>{term=e.target.value;const pos=term.length;render();const el=document.getElementById('retailSearch');el.focus();el.setSelectionRange(pos,pos)};document.getElementById('retailCustomer').oninput=e=>customer=e.target.value;document.getElementById('retailPayment').onchange=e=>payment=e.target.value;document.getElementById('retailDiscount').onchange=e=>{discount=Math.max(0,Number(e.target.value)||0);render()};document.getElementById('clearCart').onclick=()=>{cart=[];discount=0;render()};content.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));content.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>add(b.dataset.inc));content.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{let l=cart.find(x=>x.id===b.dataset.dec);if(l)l.qty--;cart=cart.filter(x=>x.qty>0);render()});content.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.remove);render()});document.getElementById('checkout').onclick=checkout;document.getElementById('retailHistory').onclick=history;
}
function checkout(){if(!cart.length)return;const d=load();d.transactions=d.transactions||[];d.movements=d.movements||[];d.retailSales=d.retailSales||[];const subtotal=cart.reduce((s,l)=>{const p=d.products.find(x=>x.id===l.id);return s+(p?Number(p.price)*l.qty:0)},0),off=Math.min(subtotal,Math.max(0,Number(discount)||0)),grand=subtotal-off;if(grand<=0){toastR('Tổng thanh toán phải lớn hơn 0');return}for(const l of cart){const p=d.products.find(x=>x.id===l.id);if(!p||p.stock<l.qty){toastR('Tồn kho không đủ cho '+(p?p.name:'một mặt hàng'));return}}const date=new Date().toISOString().slice(0,10),id='BL'+Date.now().toString().slice(-8),party=customer.trim()||'Khách lẻ';const items=cart.map(l=>{const p=d.products.find(x=>x.id===l.id);p.stock-=l.qty;d.movements.push({id:'XK'+Math.random().toString(36).slice(2,8).toUpperCase(),date,type:'out',productId:p.id,qty:l.qty,unitCost:Number(p.cost)||0,party,note:'Bán lẻ '+id});return {productId:p.id,name:p.name,qty:l.qty,price:Number(p.price)||0}});d.transactions.push({id:'PT'+id,date,type:'in',category:'Bán lẻ',party,amount:grand,method:payment,note:'Đơn '+id+' · Giảm giá '+off+' ₫'});d.retailSales.unshift({id,date,party,payment,subtotal,discount:off,total:grand,items});persist(d);cart=[];discount=0;term='';render();toastR('Thanh toán thành công · '+id+' · '+money(grand))}
function history(){const d=load(),sales=d.retailSales||[],panel=document.getElementById('retailHistoryPanel');panel.innerHTML='<div class="table-panel"><div class="panel-head"><div><h2>Lịch sử đơn bán lẻ</h2><p>'+sales.length+' đơn đã ghi nhận</p></div></div><div class="tablewrap"><table><thead><tr><th>Mã đơn</th><th>Ngày</th><th>Khách hàng</th><th>Sản phẩm</th><th>Thanh toán</th><th>Tổng tiền</th></tr></thead><tbody>'+(sales.length?sales.map(s=>'<tr><td><b>'+escR(s.id)+'</b></td><td>'+escR(s.date)+'</td><td>'+escR(s.party)+'</td><td>'+s.items.map(i=>escR(i.name)+' × '+i.qty).join('<br>')+'</td><td>'+escR(s.payment)+'</td><td><b>'+money(s.total)+'</b></td></tr>').join(''):'<tr><td colspan="6" class="empty">Chưa có đơn bán lẻ</td></tr>')+'</tbody></table></div></div>';panel.scrollIntoView({behavior:'smooth',block:'start'})}
})();
</script>
<script>
(()=>{'use strict';
const KEY='qlpro_sheets_url',DATA='qlpro_data',DEFAULT_ENDPOINT='https://script.google.com/macros/s/AKfycbzQ8nV4xV5pn_q7dbPOiHOCDkzWfeFlBXb-kdG3QSNq7eqEsH0imKDH23moSt9mmPnszg/exec';let syncTimer=null;
const escS=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function currentData(){try{return JSON.parse(localStorage.getItem(DATA))||{}}catch(e){return {}}}
function endpoint(){return (localStorage.getItem(KEY)||DEFAULT_ENDPOINT).trim()}
function syncStatus(msg,good=false){const el=document.getElementById('sheetsStatus');if(el){el.textContent=msg;el.style.color=good?'var(--green)':'var(--muted)'}}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='__qlSheets_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Hết thời gian chờ phản hồi Google Sheets'))},15000);function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('Không gọi được Apps Script. Kiểm tra URL và quyền triển khai.'))};script.src=url+(url.includes('?')?'&':'?')+'action=read&callback='+cb+'&t='+Date.now();document.head.appendChild(script)})}
async function push(show=true){const url=endpoint();if(!url){if(show)openSettings();return}try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'write',data:currentData()})});syncStatus('Đã gửi dữ liệu lên Google Sheets · '+new Date().toLocaleTimeString('vi-VN'),true);if(show)alert('Đã gửi yêu cầu đồng bộ. Hãy kiểm tra các tab trong Google Sheets để xác nhận dữ liệu đã cập nhật.')}catch(e){syncStatus('Chưa gửi được dữ liệu. Kiểm tra kết nối và URL.');if(show)alert('Không gửi được dữ liệu: '+e.message)}}
async function pull(){const url=endpoint();if(!url)throw new Error('Hãy nhập URL Apps Script trước.');const result=await jsonp(url);if(!result||!result.ok||!result.data)throw new Error(result&&result.error?result.error:'Apps Script không trả về dữ liệu hợp lệ.');if(!confirm('Tải dữ liệu từ Google Sheets sẽ thay thế dữ liệu đang có trên trình duyệt này. Bạn nên sao lưu trước. Tiếp tục?'))return;localStorage.setItem(DATA,JSON.stringify(result.data));location.reload()}
function openSettings(){let root=document.getElementById('sheetsSetupRoot');if(!root){root=document.createElement('div');root.id='sheetsSetupRoot';document.body.appendChild(root)}root.innerHTML='<div class="modal-backdrop" id="sheetsBackdrop"><div class="modal"><div class="modal-head"><h2>Kết nối Google Sheets</h2><button class="iconbtn" id="sheetsClose">✕</button></div><div class="modal-content"><div class="notice"><b>Cách hoạt động:</b> dữ liệu web app sẽ được gửi đến Apps Script và ghi vào các tab Hàng hóa, Khách hàng, Nhà cung cấp, Thu chi, Nhập xuất kho và Bán lẻ. Hãy triển khai Apps Script trong đúng tài khoản có quyền chỉnh sửa bảng tính.</div><div class="form-group"><label>URL Apps Script Web App kết thúc bằng /exec</label><input class="field" id="sheetsUrl" style="width:100%" placeholder="https://script.google.com/macros/s/.../exec" value="'+escS(endpoint())+'"></div><div id="sheetsStatus" style="font-size:12px;margin-top:12px;color:var(--muted)">'+(endpoint()?'Đã lưu URL kết nối trên trình duyệt này.':'Chưa cấu hình kết nối.')+'</div><div class="modal-actions" style="justify-content:space-between;flex-wrap:wrap"><button class="btn" id="sheetsPull">Tải từ Sheets</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="sheetsSave">Lưu URL</button><button class="btn primary" id="sheetsPush">Đồng bộ lên Sheets</button></div></div><p class="footer-note">Lưu ý: dữ liệu đang dùng trên trình duyệt vẫn được giữ lại. Không bấm “Tải từ Sheets” nếu chưa muốn thay thế dữ liệu hiện tại.</p></div></div></div>';
document.getElementById('sheetsClose').onclick=()=>root.innerHTML='';document.getElementById('sheetsBackdrop').onclick=e=>{if(e.target.id==='sheetsBackdrop')root.innerHTML=''};
document.getElementById('sheetsSave').onclick=()=>{const u=document.getElementById('sheetsUrl').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec(?:\?.*)?$/.test(u)){syncStatus('URL chưa đúng định dạng. Hãy dùng URL triển khai kết thúc bằng /exec.');return}localStorage.setItem(KEY,u);syncStatus('Đã lưu URL trên trình duyệt này.',true)};
document.getElementById('sheetsPush').onclick=async()=>{document.getElementById('sheetsSave').click();if(endpoint())await push(true)};
document.getElementById('sheetsPull').onclick=async()=>{document.getElementById('sheetsSave').click();if(!endpoint())return;try{const r=await jsonp(endpoint());if(!r||!r.ok)throw new Error(r&&r.error||'Không đọc được dữ liệu.');syncStatus('Kết nối thành công. Google Sheets có thể đọc được.',true);if(confirm('Kết nối thành công. Bạn muốn nạp dữ liệu từ Sheets và thay thế dữ liệu trên trình duyệt không?')){localStorage.setItem(DATA,JSON.stringify(r.data));location.reload()}}catch(e){syncStatus(e.message);alert(e.message)}};
}
const top=document.querySelector('.top-actions');if(top){const b=document.createElement('button');b.className='btn small';b.textContent='☁ Google Sheets';b.title='Cấu hình và đồng bộ Google Sheets';b.onclick=openSettings;top.insertBefore(b,top.firstChild)}
const originalSet=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){const out=originalSet.apply(this,arguments);if(k===DATA&&endpoint()){clearTimeout(syncTimer);syncTimer=setTimeout(()=>push(false),900)}return out};
window.addEventListener('online',()=>{if(endpoint())push(false)});
})();

<script>
(function () {
  'use strict';

  document.addEventListener('click', function (e) {
    if (e.target?.id !== 'checkout') return;

    const input = document.getElementById('retailDiscount');
    const mode = document.getElementById('retailDiscountMode');

    if (!input || !mode || mode.value !== 'percent') return;

    const subtotalText = [
      ...document.querySelectorAll(
        '#content .panel:last-child .panel-body div[style*="justify-content:space-between"]'
      )
    ].find(row => row.textContent.includes('Tiền hàng'))
      ?.querySelector('b')?.textContent || '0';

    const subtotal = Number(subtotalText.replace(/[^\d]/g, '')) || 0;
    const percent = Math.min(100, Math.max(0, Number(input.value) || 0));

    // Chuyển phần trăm thành số tiền giảm.
    input.value = String(Math.round(subtotal * percent / 100));

    // Chuyển sang chế độ giảm theo số tiền.
    mode.value = 'amount';
    mode.dispatchEvent(new Event('change', { bubbles: true }));
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }, true);
})();
</script>
